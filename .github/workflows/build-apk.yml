name: Build & Release Ferox APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare environment files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APKs
        run: |
          mkdir -p release
          cp -f app/build/outputs/apk/debug/app-debug.apk release/Ferox-v2.5.apk
          cp -f app/build/outputs/apk/debug/app-debug.apk release/Ferox-v1.0-Beta.apk
          cp -f app/build/outputs/apk/debug/app-debug.apk release/app-debug.apk
          ls -lh release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ferox-v2.5-APK
          path: release/Ferox-v2.5.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ferox v2.5 (Dernière Version)"
          draft: false
          prerelease: false
          body: |
            ## ⚡ Ferox v2.5 — Mise à jour Officielle
            
            - ✅ Correction complète et déblocage de l'importation de photo de profil pour l'inscription
            - 🔔 Notifications interactives avec réponse directe style Messenger
            - ⚡ Réduction de la bande passante et stockage maintenu sous les 20 Mo
            
            ### 📥 Fichiers APK disponibles :
            - **Ferox-v2.5.apk** (Recommandé)
            - **Ferox-v1.0-Beta.apk** (Compatibilité)
            - **app-debug.apk**
          files: |
            release/Ferox-v2.5.apk
            release/Ferox-v1.0-Beta.apk
            release/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
