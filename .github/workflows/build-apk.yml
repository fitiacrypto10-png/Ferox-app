name: Build & Release Ferox APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ferox-v1.0-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Ferox v1.0 Bêta — Chat Vocal Truckers of Europe"
          tag_name: ${{ github.ref_name || 'v1.0.0-beta' }}
          draft: false
          prerelease: true
          body: |
            ## ⚡ Ferox v1.0 Bêta — Release Officielle
            
            Application de chat vocal en temps réel pour **Truckers of Europe** créée par **delt slay**.
            
            ### ✨ Fonctionnalités incluses :
            - 🎮 **Chat Vocal Plein Écran** pour la communauté Truckers of Europe.
            - 💬 **Bulle Flottante Ronde extérieure (Messenger)** avec auto-snap magnétique aux bords de l'écran.
            - 🎙️ **Mini-fenêtre 125 dp** pour couper/activer le micro instantanément.
            - 🛡️ **Fiche Créateur certifiée** : développé par **delt slay**.
            - 100% Gratuit — Aucune publicité intrusive.
            
            ### 📥 Téléchargement direct :
            Téléchargez le fichier `app-debug.apk` ci-dessous et installez-le sur votre téléphone Android.
          files: app/build/outputs/apk/debug/app-debug.apk
